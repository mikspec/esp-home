substitutions:
  name: boiler-socket
  friendly_name: boiler-socket

packages:
  liberator.sonoff-s60: "github://adamsthws/firmware-liberator/devices/sonoff-s60/esphome.yaml@v3.0.0"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

ota:
    platform: esphome
    encryption:
    
api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  ota: false
