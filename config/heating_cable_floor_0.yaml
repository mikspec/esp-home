esphome:
  name: heating-cable-floor-0
  friendly_name: Heating Cable Floor 0

esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Heating Cable Floor 0 Fallback"
    password: !secret fallback_password

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

status_led:
  pin:
    number: GPIO13
    inverted: true

switch:
  - platform: gpio
    id: heating_cable_relay
    name: None
    pin: GPIO12
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: button
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - switch.toggle: heating_cable_relay
