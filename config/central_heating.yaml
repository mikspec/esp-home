esphome:
  name: central-heating

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: none

  ap:
    ssid: "Central Heating Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

esp32_ble_tracker:

bluetooth_proxy:
  active: false

switch:
  - platform: gpio
    id: central_heating_relay
    name: "Central Heating Relay"
    pin:
      number: GPIO16
    restore_mode: ALWAYS_OFF
