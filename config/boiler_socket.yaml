substitutions:
  name: boiler-socket
  friendly_name: boiler-socket

packages:
  liberator.sonoff-s60: !include packages/sonoff-s60/esphome.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

ota:
    platform: esphome
    encryption:
    
api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  ota: false
